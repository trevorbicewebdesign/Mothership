services:
  joomla:
    image: ghcr.io/trevorbicewebdesign/mothership:php8.2-joomla5.3.0
    pull_policy: if_not_present
    ports:
      - "8080:80"
    # Selenium is only a dependency of the acceptance tests, not of Joomla itself,
    # so it is not listed here: `docker compose up joomla` must not drag it in.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/ || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
    volumes:
      - ./tests:/var/www/html/tests
      - ./site:/var/www/html/components/com_mothership
      - ./admin:/var/www/html/administrator/components/com_mothership
      - ./mothership.xml:/var/www/html/administrator/components/com_mothership/mothership.xml
      
      - ./admin/language/en-GB/com_mothership.ini:/var/www/html/administrator/language/en-GB/com_mothership.ini
      - ./admin/language/en-GB/com_mothership.sys.ini:/var/www/html/administrator/language/en-GB/com_mothership.sys.ini
      - ./site/language/en-GB/com_mothership.ini:/var/www/html/language/en-GB/com_mothership.ini
      - ./site/language/en-GB/com_mothership.sys.ini:/var/www/html/language/en-GB/com_mothership.sys.ini

      - ./plugins/mothership-payment/paybycheck/language/en-GB/en-GB.plg_mothership-payment_paybycheck.ini:/var/www/html/administrator/language/en-GB/plg_mothership-payment_paybycheck.ini
      - ./plugins/mothership-payment/paybycheck/language/en-GB/en-GB.plg_mothership-payment_paybycheck.sys.ini:/var/www/html/administrator/language/en-GB/plg_mothership-payment_paybycheck.sys.ini
      - ./plugins/mothership-payment/zelle/language/en-GB/en-GB.plg_mothership-payment_zelle.ini:/var/www/html/administrator/language/en-GB/plg_mothership-payment_zelle.ini
      - ./plugins/mothership-payment/zelle/language/en-GB/en-GB.plg_mothership-payment_zelle.sys.ini:/var/www/html/administrator/language/en-GB/plg_mothership-payment_zelle.sys.ini

      - ./plugins/mothership-payment:/var/www/html/plugins/mothership-payment

      - ./plugins/mothership-invoice-pdf/zelle/language/en-GB/en-GB.plg_mothership-invoice-pdf_zelle.ini:/var/www/html/administrator/language/en-GB/plg_mothership-invoice-pdf_zelle.ini
      - ./plugins/mothership-invoice-pdf/zelle/language/en-GB/en-GB.plg_mothership-invoice-pdf_zelle.sys.ini:/var/www/html/administrator/language/en-GB/plg_mothership-invoice-pdf_zelle.sys.ini

      - ./plugins/mothership-invoice-pdf:/var/www/html/plugins/mothership-invoice-pdf

      - ./codeception.yml:/var/www/html/codeception.yml
      - ./tests/configuration.php:/var/www/html/configuration.php
    restart: always

  db:
    image: ghcr.io/trevorbicewebdesign/mysql:8.0
    pull_policy: if_not_present
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: local
    ports:
      - "3306:3306"
    # TCP only comes up after the entrypoint has run tests/sql/*.sql on its
    # socket-only init server, so a TCP ping means the schema is loaded.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    volumes:
      - ./tests/sql:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql

  selenium:
    image: ghcr.io/trevorbicewebdesign/selenium-standalone-chrome:129.0
    pull_policy: if_not_present
    ports:
      - "4444:4444"
    shm_size: 2gb
    healthcheck:
      # Ships with the Selenium images; reports ready once the grid accepts sessions.
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 5s
  
  mailpit:
    image: ghcr.io/trevorbicewebdesign/mailpit:1.18.0
    pull_policy: if_not_present
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP port
    healthcheck:
      # The image's own healthcheck polls every 15s; this keeps `up --wait` snappy.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: always

volumes:
  db_data:
