# Integration suite configuration
#
# Run integration and "WordPress unit" tests.

actor: IntegrationTester
bootstrap: _bootstrap.php
modules:
    enabled:
        - Tests\Support\Helper\Integration
        - Asserts  
        - Helper\DbHelper
        - Mailpit
    config:
        Mailpit:
            base_uri: http://mailpit:8025
        Helper\DbHelper:
            dsn: '%DSN%'
            user: '%DBUSER%'
            password: '%DBPASS%'
            dump: '%DBDUMP%'
            createIfNotExists: true
            # Reload the dump before each test so tests never inherit each other's rows.
            # Safe because DSN names the separate test database: check tests/.env first.
            populate: true
            populator: '%DBPOPULATOR%'
            cleanup: true
            reconnect: true
