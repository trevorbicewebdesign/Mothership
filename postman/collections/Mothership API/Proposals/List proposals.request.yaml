$kind: http-request
description: "Proposals, newest first. Proposals have no filters. Lists are paged: page[limit] (20 by default) and page[offset]."
method: GET
url: '{{base_url}}/api/index.php/v1/mothership/proposals'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200 with JSON:API', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/vnd.api+json');
      });

      const records = pm.response.json().data;
      const seeded = records.find((record) => record.id === '9001');

      pm.test('includes the seeded record', () => {
        pm.expect(seeded, 'record 9001').to.be.an('object');
        pm.expect(seeded.type).to.eql('proposals');
        pm.expect(seeded.attributes).to.include({"number": "P-9001", "status": "Pending", "total": "250.00"});
      });

      pm.test('every record has exactly the list fields', () => {
        records.forEach((record) => pm.expect(record.attributes).to.have.all.keys(["id", "number", "name", "type", "client_id", "client_name", "account_id", "account_name", "project_id", "project_name", "total", "status", "locked", "created", "created_by"]));
      });
examples: './.resources/List proposals.resources/examples'
