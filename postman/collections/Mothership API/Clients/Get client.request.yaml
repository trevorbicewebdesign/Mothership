$kind: http-request
description: "One client, with the fields the list leaves out."
method: GET
url: '{{base_url}}/api/index.php/v1/mothership/clients/:id'
order: 2000
pathVariables:
  - key: id
    value: '9001'
    description: The record's id.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200 with JSON:API', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/vnd.api+json');
      });

      const record = pm.response.json().data;

      pm.test('returns the requested record', () => {
        pm.expect(record.id).to.eql('9001');
        pm.expect(record.type).to.eql('clients');
        pm.expect(record.attributes).to.include({"name": "Postman Test Client", "city": "Testville", "default_rate": "100.00"});
      });

      pm.test('has exactly the item fields', () => {
        pm.expect(record.attributes).to.have.all.keys(["id", "name", "email", "phone", "address_1", "address_2", "city", "state", "zip", "default_rate", "owner_user_id", "created", "created_by"]);
      });

      pm.test('does not expose the tax id', () => pm.expect(record.attributes).to.not.have.property('tax_id'));
examples: './.resources/Get client.resources/examples'
