$kind: http-request
description: "Clients, by name. Lists are paged: page[limit] (20 by default) and page[offset]."
method: GET
url: '{{base_url}}/api/index.php/v1/mothership/clients?filter[search]=Postman Test'
order: 1000
queryParams:
  - key: 'filter[search]'
    value: 'Postman Test'
    description: "Only clients whose name contains this text."
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200 with JSON:API', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/vnd.api+json');
      });

      const records = pm.response.json().data;
      const seeded = records.find((record) => record.id === '9001');

      pm.test('includes the seeded record', () => {
        pm.expect(seeded, 'record 9001').to.be.an('object');
        pm.expect(seeded.type).to.eql('clients');
        pm.expect(seeded.attributes).to.include({"name": "Postman Test Client", "email": "client@example.com"});
      });

      pm.test('every record has exactly the list fields', () => {
        records.forEach((record) => pm.expect(record.attributes).to.have.all.keys(["id", "name", "email", "phone", "address_1", "address_2", "city", "state", "zip", "default_rate", "owner_user_id", "created"]));
      });
examples: './.resources/List clients.resources/examples'
