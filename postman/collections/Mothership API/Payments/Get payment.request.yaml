$kind: http-request
description: "One payment, with the fields the list leaves out."
method: GET
url: '{{base_url}}/api/index.php/v1/mothership/payments/:id'
order: 2000
pathVariables:
  - key: id
    value: '9001'
    description: The record's id.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200 with JSON:API', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/vnd.api+json');
      });

      const record = pm.response.json().data;

      pm.test('returns the requested record', () => {
        pm.expect(record.id).to.eql('9001');
        pm.expect(record.type).to.eql('payments');
        pm.expect(record.attributes).to.include({"amount": "100.00", "transaction_id": "POSTMAN-9001", "status": "Completed"});
      });

      pm.test('has exactly the item fields', () => {
        pm.expect(record.attributes).to.have.all.keys(["id", "client_id", "account_id", "amount", "fee_amount", "fee_passed_on", "payment_method", "transaction_id", "payment_date", "processed_date", "status", "locked", "created_by", "created_at", "updated_at"]);
      });
examples: './.resources/Get payment.resources/examples'
