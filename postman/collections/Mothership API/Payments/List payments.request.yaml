$kind: http-request
description: "Payments, most recent first. filter[account_id] narrows to one account in the same way. filter[payment_method] narrows to one method, such as zelle. Lists are paged: page[limit] (20 by default) and page[offset]."
method: GET
url: '{{base_url}}/api/index.php/v1/mothership/payments?filter[client_id]=9001&filter[status]=2'
order: 1000
queryParams:
  - key: 'filter[client_id]'
    value: '9001'
    description: "Only records that belong to this client."
  - key: 'filter[status]'
    value: '2'
    description: "Only payments in this status: 1 Pending, 2 Completed, 3 Failed, 4 Cancelled, 5 Refunded."
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responds 200 with JSON:API', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/vnd.api+json');
      });

      const records = pm.response.json().data;
      const seeded = records.find((record) => record.id === '9001');

      pm.test('includes the seeded record', () => {
        pm.expect(seeded, 'record 9001').to.be.an('object');
        pm.expect(seeded.type).to.eql('payments');
        pm.expect(seeded.attributes).to.include({"amount": "100.00", "payment_method": "zelle", "status": "Completed"});
      });

      pm.test('every record has exactly the list fields', () => {
        records.forEach((record) => pm.expect(record.attributes).to.have.all.keys(["id", "client_id", "client_name", "account_id", "account_name", "amount", "payment_method", "payment_date", "status", "locked", "created_at"]));
      });

      pm.test('the filter is applied to every record', () => {
        records.forEach((record) => pm.expect(record.attributes).to.include({"client_id": 9001, "status": "Completed"}));
      });
examples: './.resources/List payments.resources/examples'
