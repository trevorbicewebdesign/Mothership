PLG_MOTHERSHIP_AI_CLAUDE="Mothership AI - Claude (Anthropic)"
PLG_MOTHERSHIP_AI_CLAUDE_XML_DESCRIPTION="Connector that lets Mothership talk to Anthropic's Claude models. Enable this plugin, set your API key and model here, then choose 'Claude' as the AI provider in the Mothership component options."
PLG_MOTHERSHIP_AI_CLAUDE_API_KEY_LABEL="API key"
PLG_MOTHERSHIP_AI_CLAUDE_API_KEY_DESC="Your Anthropic API key. Treat it as a secret. Get one at console.anthropic.com."
PLG_MOTHERSHIP_AI_CLAUDE_MODEL_LABEL="Model"
PLG_MOTHERSHIP_AI_CLAUDE_MODEL_DESC="Which Claude model to use. Fable is the most capable and the most expensive; Opus, Sonnet and Haiku are progressively cheaper and faster."
PLG_MOTHERSHIP_AI_CLAUDE_MAX_TOKENS_LABEL="Max response tokens"
PLG_MOTHERSHIP_AI_CLAUDE_MAX_TOKENS_DESC="Upper limit on the length of each response. Higher allows longer output but costs more. Models that think before they answer are given room for that on top."
PLG_MOTHERSHIP_AI_CLAUDE_BASE_URL_LABEL="API base URL (optional)"
PLG_MOTHERSHIP_AI_CLAUDE_BASE_URL_DESC="Leave blank for the Anthropic default (https://api.anthropic.com). Set only to route through a proxy or gateway."
PLG_MOTHERSHIP_AI_CLAUDE_RATES_LABEL="Rates"
PLG_MOTHERSHIP_AI_CLAUDE_RATES_DESC="Used to estimate what each call costs. Leave empty to use Anthropic's list prices as built in. To change a price or add a model, write one line per model: model = input, output, in US dollars per million tokens. Past calls keep the cost they were recorded with."
