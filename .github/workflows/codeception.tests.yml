name: Run Mothership Tests

on:
  workflow_dispatch:
  # Lets release.yml run this whole workflow before it publishes anything.
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

# A new push to the same PR/branch supersedes the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no containers. They also cover code no test reaches.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The oldest PHP the component supports (composer.json), so newer syntax is caught.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: PHP syntax
        run: |
          failed=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || failed=1
          done < <(git ls-files '*.php' ':!:admin/vendor')
          exit $failed

      - name: shellcheck
        run: shellcheck build/*.sh docker/*.sh

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -eu
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version

      - name: actionlint
        run: ./actionlint -color

      # The acceptance suite runs one --group per matrix row below, so a test without one
      # of those groups would never run.
      - name: Every acceptance test belongs to a CI group
        run: php tests/check-groups.php

  test:
    name: Testing ${{ matrix.suite }} ${{ matrix.group || '' }}
    runs-on: ubuntu-latest
    # The old wait loops had no upper bound; a stuck container burned the 6h default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: functional
          - suite: api
          - suite: integration
          - suite: acceptance
            group: backend-client
          - suite: acceptance
            group: backend-portaluser
          - suite: acceptance
            group: backend-account
          - suite: acceptance
            group: backend-project
          - suite: acceptance
            group: backend-domain
          - suite: acceptance
            group: backend-invoice
          - suite: acceptance
            group: backend-proposal
          - suite: acceptance
            group: backend-payment
          - suite: acceptance
            group: backend-options
          - suite: acceptance
            group: backend-log
          - suite: acceptance
            group: backend-email
          - suite: acceptance
            group: backend-menus
          - suite: acceptance
            group: frontend

    env:
      # Only the browser suite needs Selenium (~1 GB image); the others don't pull it.
      COMPOSE_SERVICES: ${{ matrix.suite == 'acceptance' && 'joomla db mailpit selenium' || 'joomla db mailpit' }}
      # Selenium sits behind a compose profile; this makes pull, logs and exec see it too.
      COMPOSE_PROFILES: ${{ matrix.suite == 'acceptance' && 'selenium' || '' }}
      ARTIFACT_NAME: ${{ matrix.suite }}-${{ matrix.group || 'default' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Every image lives on GHCR; nothing is pulled from Docker Hub.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Prepare test config
        run: cp tests/.env.sample tests/.env

      - name: Pull images
        # One parallel pull of just the services this job uses (the old step pulled
        # all four images one after another).
        # COMPOSE_SERVICES is a space-separated list, so it must stay unquoted.
        run: |
          # shellcheck disable=SC2086
          docker compose pull --quiet $COMPOSE_SERVICES

      - name: Start services
        # Returns once every service's healthcheck passes (see docker-compose.yml),
        # which replaces the sleep-5 polling loops and the TCP-vs-init-server race
        # in the old "mysqladmin ping" check.
        run: |
          # shellcheck disable=SC2086
          docker compose up -d --wait --wait-timeout 180 $COMPOSE_SERVICES

      - name: Discover & Install Mothership via CLI
        run: |
          docker compose exec -T joomla php /var/www/html/cli/joomla.php extension:discover
          docker compose exec -T joomla php /var/www/html/cli/joomla.php extension:discover:install
          docker compose exec -T db mysql -uroot -proot -e "UPDATE local.jos_extensions SET enabled = 1 WHERE type = 'plugin' AND folder = 'mothership-payment' AND element IN ('zelle', 'paybycheck');"

      - name: Add Joomla admin user
        run: docker compose exec -T joomla php /var/www/html/cli/joomla.php user:add --username=admin --name='Site Admin' --password='password123!test' --email='admin@example.com' --usergroup='Super Users' --quiet

      - name: Export Database
        # tests/ is bind-mounted into the joomla container, so writing the dump on
        # the host is enough for the Codeception Db module to find it.
        run: docker compose exec -T db mysqldump -uroot -proot --no-tablespaces --skip-comments --extended-insert=false local > tests/_support/Data/db/dump.sql

      - name: Run Codeception Tests for ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
          GROUP: ${{ matrix.group }}
        run: |
          GROUP_ARGS=()
          if [ -n "$GROUP" ]; then
            GROUP_ARGS=(--group "$GROUP")
          fi
          docker compose exec -T joomla /var/www/html/vendor/bin/codecept run "$SUITE" "${GROUP_ARGS[@]}" --skip-group skipCI

      - name: Collect service logs
        if: failure()
        run: |
          mkdir -p service-logs
          docker compose logs --no-color --timestamps > service-logs/docker-compose.log 2>&1 || true
          docker compose exec -T joomla sh -c 'cat /var/log/apache2/error.log 2>/dev/null' > service-logs/apache-error.log || true

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-output-${{ github.sha }}
          path: |
            tests/_output/
            service-logs/
          if-no-files-found: ignore
          retention-days: 14
